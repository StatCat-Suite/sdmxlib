        agencyID=\"SDMX\" id=\"CL_FREQ\" version=\"2.1\"><com:Name xml:lang=\"en\">Code
        list for concept \"Frequency\"</com:Name><com:Description xml:lang=\"en\">This
        code list provides a set of values indicating the\n          \"frequency\"
        of the data (e.g. weekly, monthly, quarterly). The concept \"frequency\" may\n
        \         refer to various stages in the production process, e.g. data collection
        or data\n          dissemination. For example, a time series could be disseminated
        at annual frequency but\n          the underlying data are compiled monthly.
        The code list is applicable for all different\n          uses of \"frequency\".</com:Description><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A\" id=\"A\"><com:Name
        xml:lang=\"en\">Annual</com:Name><com:Description xml:lang=\"en\">To be used
        for data collected or disseminated every\n            year</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A2\" id=\"A2\"><com:Name
        xml:lang=\"en\">Biennial</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated every two\n            years</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A3\" id=\"A3\"><com:Name
        xml:lang=\"en\">Triennial</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated every\n            three years</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A4\" id=\"A4\"><com:Name
        xml:lang=\"en\">Quadrennial</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated every four\n            years</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A5\" id=\"A5\"><com:Name
        xml:lang=\"en\">Quinquennial</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated every five\n            years</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A10\" id=\"A10\"><com:Name
        xml:lang=\"en\">Decennial</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated every ten\n            years</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A20\" id=\"A20\"><com:Name
        xml:lang=\"en\">Bidecennial</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated every\n            twenty years</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A30\" id=\"A30\"><com:Name
        xml:lang=\"en\">Tridecennial</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated every\n            thirty years</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A_3\" id=\"A_3\"><com:Name
        xml:lang=\"en\">Three times a year</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated three\n            times a year</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).S\" id=\"S\"><com:Name
        xml:lang=\"en\">Half-yearly, semester</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated every\n            semester</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).Q\" id=\"Q\"><com:Name
        xml:lang=\"en\">Quarterly</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated every\n            quarter</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).M\" id=\"M\"><com:Name
        xml:lang=\"en\">Monthly</com:Name><com:Description xml:lang=\"en\">To be used
        for data collected or disseminated every\n            month</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).M2\" id=\"M2\"><com:Name
        xml:lang=\"en\">Bimonthly</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated every two\n            months</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).M_2\" id=\"M_2\"><com:Name
        xml:lang=\"en\">Semimonthly</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated twice a\n            month</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).M_3\" id=\"M_3\"><com:Name
        xml:lang=\"en\">Three times a month</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated three\n            times a month</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).W\" id=\"W\"><com:Name
        xml:lang=\"en\">Weekly</com:Name><com:Description xml:lang=\"en\">To be used
        for data collected or disseminated every\n            week</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).W2\" id=\"W2\"><com:Name
        xml:lang=\"en\">Biweekly</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated every two\n            weeks</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).W3\" id=\"W3\"><com:Name
        xml:lang=\"en\">Triweekly</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated every\n            three weeks</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).W4\" id=\"W4\"><com:Name
        xml:lang=\"en\">Four-weekly</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated every four\n            weeks</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).W_2\" id=\"W_2\"><com:Name
        xml:lang=\"en\">Semiweekly</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated twice a\n            week</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).W_3\" id=\"W_3\"><com:Name
        xml:lang=\"en\">Three times a week</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated three\n            times a week</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).D\" id=\"D\"><com:Name
        xml:lang=\"en\">Daily</com:Name><com:Description xml:lang=\"en\">To be used
        for data collected or disseminated every\n            day</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).D_2\" id=\"D_2\"><com:Name
        xml:lang=\"en\">Twice a day</com:Name><com:Description xml:lang=\"en\">To
        be used for data collected or disseminated twice a\n            day</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).H\" id=\"H\"><com:Name
        xml:lang=\"en\">Hourly</com:Name><com:Description xml:lang=\"en\">To be used
        for data collected or disseminated every\n            hour</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).H2\" id=\"H2\"><com:Name
        xml:lang=\"en\">Bihourly</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated every two\n            hours</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).H3\" id=\"H3\"><com:Name
        xml:lang=\"en\">Trihourly</com:Name><com:Description xml:lang=\"en\">To be
        used for data collected or disseminated every\n            three hours</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).B\" id=\"B\"><com:Name
        xml:lang=\"en\">Daily \u2013 business week</com:Name><com:Description xml:lang=\"en\">Similar
        to \"daily\", however there are no observations\n            for Saturdays
        and Sundays (so, neither \u201Cmissing values\u201D nor \u201Cnumeric values\u201D
        should be\n            provided for Saturday and Sunday)</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).N\" id=\"N\"><com:Name
        xml:lang=\"en\">Minutely</com:Name><com:Description xml:lang=\"en\">While
        N denotes \"minutely\", usually, there may be no\n            observations
        every minute (for several series the frequency is usually \"irregular\"\n
        \           within a day/days). And though observations may be sparse (not
        collected or disseminated\n            every minute), missing values do not
        need to be given for the minutes when no\n            observations exist:
        in any case the time stamp determines when an observation is\n            observed</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).I\" id=\"I\"><com:Name
        xml:lang=\"en\">Irregular</com:Name><com:Description xml:lang=\"en\">To be
        used with irregular time series that stores data\n            for a sequence
        of arbitrary timepoints. Irregular time series are appropriate when the\n
        \           data arrives unpredictably, such as when the application records
        every stock trade or\n            when random events are recorded (the interval
        between each element can be a different\n            length)</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).OA\" id=\"OA\"><com:Name
        xml:lang=\"en\">Occasional annual</com:Name><com:Description xml:lang=\"en\">The
        event occurs occasionally with an infrequent update\n            that could
        span from 1 year to several years between events. It implies a survey that\n
        \           experiences a gap for several years prior to the next survey update
        (this is commonly\n            linked to funding available to run a specific
        survey (i.e. health surveys), whereas a\n            regular annual survey
        refers typically to \u2018programs\u2019 that are funded regularly and fall\n
        \           under the Statistics Act, and therefore never experience a gap)</com:Description></str:Code><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).OM\" id=\"OM\"><com:Name
        xml:lang=\"en\">Occasional monthly</com:Name><com:Description xml:lang=\"en\">The
        event occurs occasionally with an infrequent update\n            that could
        span from 1 month to several months between events. It implies a survey that\n
        \           experiences a gap for several months prior to the next survey\n
        \           update</com:Description></str:Code><str:Code urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1)._O\"
        id=\"_O\"><com:Name xml:lang=\"en\">Other</com:Name><com:Description xml:lang=\"en\">To
        be used when the qualitative or quantitative values\n            that a variable
        takes in a data set is associated to multiple occurrences with frequency\n
        \           other than the already defined ones (for example every 5 hours
        and 32 minutes\n            etc.)</com:Description></str:Code><str:Code urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1)._U\"
        id=\"_U\"><com:Name xml:lang=\"en\">Unspecified</com:Name><com:Description
        xml:lang=\"en\">To be used when a set of values are reported within a\n            time
        range but not associated to sub ranges. Often this could happen in case of
        missing\n            or sparse information. (Let\u2019s say we have two observations
        for 2020 but we do not know\n            if they are part of a monthly reporting
        or quarterly reporting)</com:Description></str:Code><str:Code urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1)._Z\"
        id=\"_Z\"><com:Name xml:lang=\"en\">Not applicable</com:Name><com:Description
        xml:lang=\"en\">To be used when the qualitative or quantitative values\n            that
        a variable takes in a data set is not associated to multiple occurrences (only\n
        \           single occurrence exists) one can use the _Z as frequency</com:Description></str:Code></str:Codelist></str:Codelists></message:Structures></message:Structure>"
