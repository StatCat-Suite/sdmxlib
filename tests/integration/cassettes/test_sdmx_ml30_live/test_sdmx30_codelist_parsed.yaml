        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Codelist=SDMX:CL_FREQ(2.1)\" isExternalReference=\"false\"
        agencyID=\"SDMX\" id=\"CL_FREQ\" version=\"2.1\"><com:Name xml:lang=\"en\">Code
        list for concept \"Frequency\"</com:Name><com:Description xml:lang=\"en\">This
        code list provides a set of values indicating the\n          \"frequency\"
        of the data (e.g. weekly, monthly, quarterly). The concept \"frequency\" may\n
        \         refer to various stages in the production process, e.g. data collection
        or data\n          dissemination. For example, a time series could be disseminated
        at annual frequency but\n          the underlying data are compiled monthly.
        The code list is applicable for all different\n          uses of \"frequency\".</com:Description><str:Code
        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).A\" id=\"A\"><com:Name
        xml:lang=\"en\">Annual</com:Name><com:Description xml:lang=\"en\">To be used
