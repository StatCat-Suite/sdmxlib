        urn=\"urn:sdmx:org.sdmx.infomodel.codelist.Code=SDMX:CL_FREQ(2.1).M_2\" id=\"M_2\"><com:Name
        xml:lang=\"en\">Semimonthly</com:Name><com:Description xml:lang=\"en\">To
