- request:
    body: "<?xml version='1.0' encoding='UTF-8'?>\n<mes:Structure xmlns:mes=\"http://www.sdmx.org/resources/sdmxml/schemas/v3_0/message\"
      xmlns:str=\"http://www.sdmx.org/resources/sdmxml/schemas/v3_0/structure\" xmlns:com=\"http://www.sdmx.org/resources/sdmxml/schemas/v3_0/common\"><mes:Header><mes:ID>SDMX_MSG</mes:ID><mes:Test>false</mes:Test><mes:Prepared>2000-01-01T00:00:00</mes:Prepared><mes:Sender
      id=\"sdmxlib\"/></mes:Header><mes:Structures><str:AgencySchemes><str:AgencyScheme
      agencyID=\"SDMX\" id=\"AGENCIES\"><com:Name xml:lang=\"en\">SDMX Agency Scheme</com:Name><str:Agency
      id=\"SDMX\"><com:Name xml:lang=\"en\">SDMX</com:Name><com:Description xml:lang=\"en\">SDMX
      is an initiative to foster standards for the exchange of statistical information.
      It is sponsored by the Bank for International Settlements (BIS), the European
      Central Bank (ECB), the Statistical Office of the European Union (Eurostat),
      the International Monetary Fund (IMF), the Organization for Economic Co-Operation
      and Development (OECD), the United Nations (UN) and the World Bank.</com:Description><str:Contact><com:Name
      xml:lang=\"en\">SDMX Secretariat</com:Name><str:Department xml:lang=\"en\">SDMX
      Secretariat</str:Department><str:Role xml:lang=\"en\">Single entry point for
      external inquiries</str:Role><str:URI>http://sdmx.org</str:URI><str:Email>secretariat@sdmx.org</str:Email></str:Contact></str:Agency><str:Agency
      id=\"IMF\"><com:Name xml:lang=\"en\">International Monetary Fund (IMF)</com:Name><com:Description
      xml:lang=\"en\">The IMF works to foster global growth and economic stability.
      It provides policy advice and financing to members in economic difficulties
      and also works with developing nations to help them achieve macroeconomic stability
      and reduce poverty.</com:Description><str:Contact><com:Name xml:lang=\"en\">Single
      point of contact for external inquiries</com:Name><str:Department xml:lang=\"en\">Statistics
      Department</str:Department><str:Role xml:lang=\"en\">Single point of contact
      for external inquiries</str:Role><str:URI>http://www.imf.org</str:URI><str:Email>StatisticsQuery@imf.org</str:Email></str:Contact></str:Agency><str:Agency
      id=\"ESTAT\"><com:Name xml:lang=\"en\">Statistical Office of the European Union
      (Eurostat)</com:Name><com:Description xml:lang=\"en\">Eurostat is the statistical
      office of the European Union situated in Luxembourg. Its task is to provide
      the European Union with high quality statistics at European level that enable
      comparisons between countries and regions. Website: http://ec.europa.eu/eurostat/.</com:Description><str:Contact><com:Name
      xml:lang=\"en\">SDMX Support</com:Name><str:Department xml:lang=\"en\">Various
      units involved in SDMX</str:Department><str:Role xml:lang=\"en\">SDMX Support</str:Role><str:URI>http://ec.europa.eu/eurostat/</str:URI><str:Email>estat-support-sdmx@ec.europa.eu</str:Email></str:Contact></str:Agency><str:Agency
      id=\"UIS\"><com:Name xml:lang=\"en\">UNESCO Institute for Statistics (UIS)</com:Name><com:Description
      xml:lang=\"en\">The UNESCO Institute for Statistics (UIS) is the statistical
      office of the United Nations Educational, Scientific and Cultural Organization
      (UNESCO). The Institute produces the data and methodologies to monitor trends
      at national and international levels. It delivers comparative data for countries
      at all stages of development to provide a global perspective on education, science
      and technology, culture, and communication. The UIS is the official source for
      the indicators needed to achieve SDG 4\u2013Education 2030 and key targets in
      science and innovation, culture and communication.</com:Description><str:Contact><com:Name
      xml:lang=\"en\">UNESCO Institute for Statistics (UIS)</com:Name><str:Department
      xml:lang=\"en\">UNESCO Institute for Statistics (UIS)</str:Department><str:Role
      xml:lang=\"en\">Single entry point for external inquiries</str:Role><str:URI>http://uis.unesco.org</str:URI><str:Email>uis.datarequests@unesco.org</str:Email></str:Contact></str:Agency><str:Agency
      id=\"OECD\"><com:Name xml:lang=\"en\">Organisation for Economic Co-operation
      and Development (OECD)</com:Name><com:Description xml:lang=\"en\">The mission
      of the Organisation for Economic Co-operation and Development (OECD) is to promote
      policies that will improve the economic and social well-being of people around
      the world.\n\nThe OECD provides a forum in which governments can work together
      to share experiences and seek solutions to common problems. We work with governments
      to understand what drives economic, social and environmental change. We measure
      productivity and global flows of trade and investment. We analyse and compare
      data to predict future trends. We set international standards on a wide range
      of things, from agriculture and tax to the safety of chemicals.\n\nWe look,
      too, at issues that directly affect the lives of ordinary people, like how much
      they pay in taxes and social security, and how much leisure time they can take.
      We compare how different countries\u2019 school systems are readying their young
      people for modern life, and how different countries\u2019 pension systems will
      look after their citizens in old age.\n\nDrawing on facts and real-life experience,
      we recommend policies designed to make the lives of ordinary people better.
      We work with business, through the Business and Industry Advisory Committee
      to the OECD, and with labour, through the Trade Union Advisory Committee. We
      have active contacts as well with other civil society organisations. The common
      thread of our work is a shared commitment to market economies backed by democratic
      institutions and focused on the wellbeing of all citizens. Along the way, we
      also set out to make life harder for the terrorists, tax dodgers, crooked businessmen
      and others whose actions undermine a fair and open society.</com:Description></str:Agency><str:Agency
      id=\"METATECH\"><com:Name xml:lang=\"en\">Metadata Technology</com:Name><com:Description
      xml:lang=\"en\">Provider of consultancy, software, and services to the SDMX
      community.</com:Description><str:Contact><com:Name xml:lang=\"en\">Chris Nelson</com:Name><str:Department
      xml:lang=\"en\">Standards</str:Department><str:Role xml:lang=\"en\">Standards
      Consultant</str:Role><str:Telephone>+44 1483 418058</str:Telephone><str:URI>http://www.metadatatechnology.com</str:URI><str:URI>http://www.sdmxfusion.com</str:URI><str:URI>http://registry.sdmxcloud.org</str:URI><str:URI>http://data.sdmxcloud.org</str:URI><str:Email>chris.nelson@metadatatechnology.com</str:Email></str:Contact><str:Contact><com:Name
      xml:lang=\"en\">Matthew Nelson</com:Name><str:Department xml:lang=\"en\">IT</str:Department><str:Role
      xml:lang=\"en\">Software Architect</str:Role><str:Telephone>+44 1483 418058</str:Telephone><str:URI>http://sdmxsource.org</str:URI><str:Email>matt.nelson@metadatatechnology.com</str:Email></str:Contact></str:Agency><str:Agency
      id=\"ILO\"><com:Name xml:lang=\"en\">International Labour Organization</com:Name><com:Description
      xml:lang=\"en\">The ILO was founded in 1919, in the wake of a destructive war,
      to pursue a vision based on the premise that universal, lasting peace can be
      established only if it is based on social justice. The ILO became the first
      specialized agency of the UN in 1946.\n\nThe main aims of the ILO are to promote
      rights at work, encourage decent employment opportunities, enhance social protection
      and strengthen dialogue on work-related issues.</com:Description></str:Agency><str:Agency
      id=\"IBGE\"><com:Name xml:lang=\"en\">The Brazilian Institute of Geography and
      Statistics</com:Name><com:Name xml:lang=\"br\">Instituto Brasileiro de Geografia
      e Estat\xEDstica</com:Name></str:Agency><str:Agency id=\"NG_NSB\"><com:Name
      xml:lang=\"en\">Nigerian National Bureau of Statistics (NBS)</com:Name><com:Description
      xml:lang=\"en\">The National Bureau of Statistics Nigeria as the mandate to
      generate, on a continuous and sustainable basis, socio-economic statistics on
      all facets of development in Nigeria.</com:Description><str:Contact><com:Name
      xml:lang=\"en\">Lucky OGIDAN</com:Name><str:Department xml:lang=\"en\">Information
      and Communication Technology Department</str:Department><str:Role xml:lang=\"en\">Web
      Application Manager</str:Role><str:URI>http://www.nigerianstat.gov.ng</str:URI><str:Email>feedback@nigerianstat.gov.ng</str:Email><str:Email>laogidan@nigerianstat.gov.ng</str:Email></str:Contact></str:Agency><str:Agency
      id=\"GW_INE\"><com:Name xml:lang=\"en\">National Statistical Institute of Guinea-Bissau
      - Instituto Nacional de Estat\xEDstica da Guin\xE9-Bissau (INE)</com:Name></str:Agency><str:Agency
      id=\"BT_NSB\"><com:Name xml:lang=\"en\">Bhutan National Statistics Bureau (NSB)</com:Name></str:Agency><str:Agency
      id=\"WB\"><com:Name xml:lang=\"en\">World Bank</com:Name><str:Contact><com:Name
      xml:lang=\"en\">Demo Contact</com:Name><str:Department xml:lang=\"en\">IT</str:Department><str:Role
      xml:lang=\"en\">IT Officer</str:Role><str:Telephone>+00 111 222 333</str:Telephone><str:Email>demo@democontact.com</str:Email></str:Contact></str:Agency><str:Agency
      id=\"IAEG\"><com:Name xml:lang=\"en\">Inter Agency Group</com:Name></str:Agency><str:Agency
      id=\"BIS\"><com:Name xml:lang=\"en\">Bank for International Settlements</com:Name></str:Agency><str:Agency
      id=\"ONS\"><com:Name xml:lang=\"en\">Office for National Statistics</com:Name><str:Contact><com:Name
      xml:lang=\"en\">Demo Contact</com:Name><str:Department xml:lang=\"en\">Statistics</str:Department><str:Role
      xml:lang=\"en\">Statistics Officer</str:Role><str:Telephone>+44 111 222 333</str:Telephone><str:URI>http://metadatatechnology.com</str:URI><str:Email>demo@democontact.com</str:Email></str:Contact></str:Agency><str:Agency
      id=\"ECB\"><com:Name xml:lang=\"en\">European Central Bank</com:Name></str:Agency><str:Agency
      id=\"EUROSTAT\"><com:Name xml:lang=\"en\">Eurostat</com:Name></str:Agency><str:Agency
      id=\"MT\"><com:Name xml:lang=\"en\">Metadata Technology</com:Name><com:Description
      xml:lang=\"en\">Metadata Technology</com:Description></str:Agency><str:Agency
      id=\"GCCSTAT\"><com:Name xml:lang=\"en\">Statistical Centre for the Cooperation
      Council for the Arab Countries of the Gulf</com:Name><com:Description xml:lang=\"en\">Statistical
      Centre for the Cooperation Council for the Arab Countries of the Gulf</com:Description></str:Agency><str:Agency
      id=\"AG\"><com:Name xml:lang=\"en\">test agency</com:Name></str:Agency></str:AgencyScheme></str:AgencySchemes></mes:Structures></mes:Structure>"
