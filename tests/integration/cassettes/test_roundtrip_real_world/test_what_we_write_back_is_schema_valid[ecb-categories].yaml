        version="1.0"><com:Name xml:lang="en">Economic concepts</com:Name><com:Description
        xml:lang="en">This category scheme is used for the Data Explorer of the ECB
        SDW mobile application. It is used for grouping all dataflows following the
        top-level categories displayed on the SDW portal.</com:Description><str:Category
        urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=ECB:MOBILE_NAVI(1.0).01"
        id="01"><com:Name xml:lang="en">Monetary operations</com:Name><com:Description
        xml:lang="en">This section shows the key ECB interest rates for the euro area
        as well as statistics on minimum reserves and liquidity factors and conditions.</com:Description></str:Category><str:Category
        urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=ECB:MOBILE_NAVI(1.0).02"
        id="02"><com:Name xml:lang="en">Prices, output, demand and labour market</com:Name><com:Description
        xml:lang="en">HICP, national accounts, labour market and survey indicator
        data.</com:Description></str:Category><str:Category urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=ECB:MOBILE_NAVI(1.0).03"
        id="03"><com:Name xml:lang="en">Monetary and financial statistics</com:Name><com:Description
        xml:lang="en">Statistics regarding monetary financial institutions (MFIs),
        investment funds, financial stability and financial markets, and payments
        within the euro area. This includes the monetary aggregates, their counterparts
        and other monetary stocks and flows statistics, including minimum reserve
        and liquidity statistics and all seasonally adjusted statistics; statistics
        on securities issues (including quoted shares), investment funds and other
        financial intermediaries, statistics on yields and interest rates, banking
        statistics, financial market statistics, financial integration indicators,
        and STEP statistics.</com:Description></str:Category><str:Category urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=ECB:MOBILE_NAVI(1.0).04"
        id="04"><com:Name xml:lang="en">Euro area accounts</com:Name><com:Description
        xml:lang="en">These statistics present balance sheets (stocks) and financial
        and non-financial flows of the different sectors of the euro area, and between
        these sectors and the rest of the world. Selected items for other economic
        areas are also included.</com:Description></str:Category><str:Category urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=ECB:MOBILE_NAVI(1.0).05"
        id="05"><com:Name xml:lang="en">Government finance</com:Name><com:Description
        xml:lang="en">These statistics show the general government deficit, debt and
        deficit-debt adjustment.</com:Description></str:Category><str:Category urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=ECB:MOBILE_NAVI(1.0).06"
        id="06"><com:Name xml:lang="en">External transactions and positions</com:Name><com:Description
        xml:lang="en">This section provides data on balance of payments (b.o.p.) statistics,
        euro area external trade in goods, aggregated data on the international investment
        position (i.i.p.) and the outstanding amounts of the Eurosystem''s international
        reserves The euro area b.o.p. is compiled by the ECB whereas the main source
        for trade data is the European Commission (Eurostat).</com:Description></str:Category><str:Category
