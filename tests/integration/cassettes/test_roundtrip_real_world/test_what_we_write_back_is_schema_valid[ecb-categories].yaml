        urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Categorisation=ECB:7C64141B-4ECF-99D2-25B3-E2DCEE35A92B(1.0)"
        isExternalReference="false" agencyID="ECB" id="7C64141B-4ECF-99D2-25B3-E2DCEE35A92B"
