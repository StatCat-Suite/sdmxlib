        id="07"><com:Name xml:lang="en">Exchange rates</com:Name><com:Description
        xml:lang="en">This section shows the euro foreign exchange reference rates
        that are based on the regular daily concertation procedure between central
        banks within and outside the European System of Central Banks, which normally
        takes place at 2.15 p.m. ECB time (CET). It also shows the nominal effective
        exchange rates of the euro as calculated by the ECB.</com:Description></str:Category><str:Category
        urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=ECB:MOBILE_NAVI(1.0).08"
        id="08"><com:Name xml:lang="en">Payments and securities trading, clearing,
        settlement</com:Name><com:Description xml:lang="en">Covers statistics of:
        payment instructions processed by TARGET and other selected interbank fund
        transfer systems, domestic payments in each RTGS system participating in or
        connected to TARGET, and statistics on cross-border payments. All data are
        presented both by volume and by value of transactions.</com:Description></str:Category><str:Category
        urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=ECB:MOBILE_NAVI(1.0).09"
        id="09"><com:Name xml:lang="en">Banknotes and Coins</com:Name></str:Category><str:Category
        urn="urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=ECB:MOBILE_NAVI(1.0).10"
