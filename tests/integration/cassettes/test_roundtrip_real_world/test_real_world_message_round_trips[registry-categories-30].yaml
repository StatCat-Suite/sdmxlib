        \n- trade in specific commodities/services mentioned in 2.4.1 to 2.4.5 (Agriculture,
        forestry, fisheries; Energy; Mining, manufacturing, construction; Transport;
        Tourism)\n- multinational companies and activities of foreign affiliates (3.3.4
        - Globalisation)</com:AnnotationText></com:Annotation><com:Annotation><com:AnnotationTitle>OFFICIAL
        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">2.6</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">International trade and balance of payments</com:Name></str:Category><str:Category
        urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ECO_STAT.PRICES\"
        id=\"PRICES\"><com:Annotations><com:Annotation><com:AnnotationTitle>EXPLANATORY
        NOTE</com:AnnotationTitle><com:AnnotationType>EXPLANATORY NOTE</com:AnnotationType><com:AnnotationText
