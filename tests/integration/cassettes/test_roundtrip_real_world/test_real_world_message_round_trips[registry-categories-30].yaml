        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">3.3.4</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Globalisation</com:Name></str:Category><str:Category urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ENVIRONMENT_MULTIDOMAIN_STAT.MULTIDOMAIN_STAT_INDIC.MILLENIUM_GOALS\"
        id=\"MILLENIUM_GOALS\"><com:Annotations><com:Annotation><com:AnnotationTitle>EXPLANATORY
