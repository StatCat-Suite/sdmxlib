        xml:lang=\"en\">2.8</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Labour cost</com:Name></str:Category><str:Category urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ECO_STAT.SCIENCE_TECHNO_INNO\"
        id=\"SCIENCE_TECHNO_INNO\"><com:Annotations><com:Annotation><com:AnnotationTitle>EXPLANATORY
        NOTE</com:AnnotationTitle><com:AnnotationType>EXPLANATORY NOTE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">Science, technology and innovation - includes Research and
        Development (R&amp;D), innovation, patents, human resources (in science, technology
        and innovation), high tech industries and knowledge based services, biotechnology,
        financing of R&amp;D and innovation. \nExcludes: \n- information and communication
        technologies (ICTs) (3.3.3 - Information society)</com:AnnotationText></com:Annotation><com:Annotation><com:AnnotationTitle>OFFICIAL
        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">2.9</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Science, technology and innovation</com:Name></str:Category></str:Category><str:Category
        urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ENVIRONMENT_MULTIDOMAIN_STAT\"
        id=\"ENVIRONMENT_MULTIDOMAIN_STAT\"><com:Annotations><com:Annotation><com:AnnotationTitle>OFFICIAL
        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">3</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Environment and multi-domain statistics</com:Name><str:Category
        urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ENVIRONMENT_MULTIDOMAIN_STAT.ENVIRONMENT\"
        id=\"ENVIRONMENT\"><com:Annotations><com:Annotation><com:AnnotationTitle>EXPLANATORY
