        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">2.7</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Prices</com:Name></str:Category><str:Category urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ECO_STAT.LABOUR_COST\"
        id=\"LABOUR_COST\"><com:Annotations><com:Annotation><com:AnnotationTitle>EXPLANATORY
        NOTE</com:AnnotationTitle><com:AnnotationType>EXPLANATORY NOTE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">Labour cost - statistics activities on labour cost, earning
