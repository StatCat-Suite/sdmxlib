        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">3.3.5</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Indicators related to the Millennium Development Goals</com:Name></str:Category><str:Category
