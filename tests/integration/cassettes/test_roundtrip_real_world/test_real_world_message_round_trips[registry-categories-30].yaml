        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">3.1</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Environment</com:Name></str:Category><str:Category urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ENVIRONMENT_MULTIDOMAIN_STAT.REGIONAL_STAT\"
        id=\"REGIONAL_STAT\"><com:Annotations><com:Annotation><com:AnnotationTitle>EXPLANATORY
        NOTE</com:AnnotationTitle><com:AnnotationType>EXPLANATORY NOTE</com:AnnotationType><com:AnnotationText
