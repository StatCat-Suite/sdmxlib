        (1.6 - Social protection) \n- financing of state pension and of other state
        social security schemes (2.5 - Government finance, fiscal and public sector
        statistics)</com:AnnotationText></com:Annotation><com:Annotation><com:AnnotationTitle>OFFICIAL
        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">2.4.6</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Banking, insurance, financial statistics</com:Name></str:Category></str:Category><str:Category
        urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ECO_STAT.GOV_FINANCE_PUBLIC_SECTOR\"
        id=\"GOV_FINANCE_PUBLIC_SECTOR\"><com:Annotations><com:Annotation><com:AnnotationTitle>EXPLANATORY
        NOTE</com:AnnotationTitle><com:AnnotationType>EXPLANATORY NOTE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">Government finance, fiscal and public sector statistics -
        all statistics related to the government sector, including debt and deficit,
        revenue and expenditure, accounts of the government sector, central government,
        tax rates and revenues, tax and benefit systems, financing of state pension
        and other state social security schemes, public sector employment.\nExcludes
        \n- government expenditure in specific areas, like health (1.4 - Health),
        education (1.3 - Education), research and development (2.9 - Science, technology
        and innovation), etc.</com:AnnotationText></com:Annotation><com:Annotation><com:AnnotationTitle>OFFICIAL
