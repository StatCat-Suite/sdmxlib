        xml:lang=\"en\">Transport - covers statistics on all modes of transport (air,
        rail, road, inland waterways, sea), includes topics like transport infrastructure,
        equipment, traffic flows, personal mobility, safety, energy consumption, transport
        enterprises, passengers and freight transport, transport sector trends, road
        traffic accidents.\nExcludes\n- transport prices (2.7 - Prices)</com:AnnotationText></com:Annotation><com:Annotation><com:AnnotationTitle>OFFICIAL
        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">2.4.4</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Transport</com:Name></str:Category><str:Category urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ECO_STAT.SECTORAL_STAT.TOURISM\"
        id=\"TOURISM\"><com:Annotations><com:Annotation><com:AnnotationTitle>EXPLANATORY
        NOTE</com:AnnotationTitle><com:AnnotationType>EXPLANATORY NOTE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">Tourism - covers statistics regarding visitor activity (such
        as arrivals/departures, overnight stays, expenditures, purpose of the visit,
        etc.) associated to different forms of tourism (inbound, domestic and outbound),
        tourism industries activity and infrastructure, employment and tourism satellite
        accounts. \nExcludes\n- prices for tourist services (2.7 - Prices)\n- environmental
        impacts (3.1 - Environment)</com:AnnotationText></com:Annotation><com:Annotation><com:AnnotationTitle>OFFICIAL
        CODE</com:AnnotationTitle><com:AnnotationType>OFFICIAL CODE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">2.4.5</com:AnnotationText></com:Annotation></com:Annotations><com:Name
        xml:lang=\"en\">Tourism</com:Name></str:Category><str:Category urn=\"urn:sdmx:org.sdmx.infomodel.categoryscheme.Category=SDMX:STAT_SUBJECT_MATTER(1.0).ECO_STAT.SECTORAL_STAT.BANK_INSURANCE_FINANCE\"
        id=\"BANK_INSURANCE_FINANCE\"><com:Annotations><com:Annotation><com:AnnotationTitle>EXPLANATORY
        NOTE</com:AnnotationTitle><com:AnnotationType>EXPLANATORY NOTE</com:AnnotationType><com:AnnotationText
        xml:lang=\"en\">Banking, insurance, financial statistics - money, banking
