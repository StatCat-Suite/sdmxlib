        xmlns:com=\"http://www.sdmx.org/resources/sdmxml/schemas/v2_1/common\"><mes:Header><mes:ID>IREF205597</mes:ID><mes:Test>false</mes:Test><mes:Prepared>2026-08-20T10:09:10Z</mes:Prepared><mes:Sender
        id=\"IMF\"/><mes:Receiver id=\"not_supplied\"/></mes:Header><mes:Structures><str:OrganisationSchemes><str:AgencyScheme
        urn=\"urn:sdmx:org.sdmx.infomodel.base.AgencyScheme=SDMX:AGENCIES(1.0)\" isExternalReference=\"false\"
        agencyID=\"SDMX\" id=\"AGENCIES\" isFinal=\"false\" version=\"1.0\"><com:Name
        xml:lang=\"en\">SDMX Agency Scheme</com:Name><str:Agency urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).SDMX\"
        id=\"SDMX\"><com:Name xml:lang=\"en\">SDMX</com:Name><com:Description xml:lang=\"en\">SDMX
        is an initiative to foster standards for the exchange of statistical information.
        It is sponsored by the Bank for International Settlements (BIS), the European
        Central Bank (ECB), the Statistical Office of the European Union (Eurostat),
        the International Monetary Fund (IMF), the Organization for Economic Co-Operation
        and Development (OECD), the United Nations (UN) and the World Bank.</com:Description><str:Contact><com:Name
        xml:lang=\"en\">SDMX Secretariat</com:Name><str:Department xml:lang=\"en\">SDMX
        Secretariat</str:Department><str:Role xml:lang=\"en\">Single entry point for
        external inquiries</str:Role><str:URI>http://sdmx.org</str:URI><str:Email>secretariat@sdmx.org</str:Email></str:Contact></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).IMF\" id=\"IMF\"><com:Name
        xml:lang=\"en\">International Monetary Fund (IMF)</com:Name><com:Description
        xml:lang=\"en\">The IMF works to foster global growth and economic stability.
        It provides policy advice and financing to members in economic difficulties
        and also works with developing nations to help them achieve macroeconomic
        stability and reduce poverty.</com:Description><str:Contact><com:Name xml:lang=\"en\">Single
        point of contact for external inquiries</com:Name><str:Department xml:lang=\"en\">Statistics
        Department</str:Department><str:Role xml:lang=\"en\">Single point of contact
        for external inquiries</str:Role><str:URI>http://www.imf.org</str:URI><str:Email>sdmx@imf.org</str:Email></str:Contact></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).ESTAT\" id=\"ESTAT\"><com:Name
        xml:lang=\"en\">Statistical Office of the European Union (Eurostat)</com:Name><com:Description
        xml:lang=\"en\">Eurostat is the statistical office of the European Union situated
        in Luxembourg. Its task is to provide the European Union with high quality
        statistics at European level that enable comparisons between countries and
        regions. Website: http://ec.europa.eu/eurostat/.</com:Description><str:Contact><com:Name
        xml:lang=\"en\">SDMX Support</com:Name><str:Department xml:lang=\"en\">Various
        units involved in SDMX</str:Department><str:Role xml:lang=\"en\">SDMX Support</str:Role><str:URI>http://ec.europa.eu/eurostat/</str:URI><str:Email>estat-support-sdmx@ec.europa.eu</str:Email></str:Contact></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).UIS\" id=\"UIS\"><com:Name
        xml:lang=\"en\">UNESCO Institute for Statistics (UIS)</com:Name><com:Description
        xml:lang=\"en\">The UNESCO Institute for Statistics (UIS) is the statistical
        office of the United Nations Educational, Scientific and Cultural Organization
        (UNESCO). The Institute produces the data and methodologies to monitor trends
        at national and international levels. It delivers comparative data for countries
        at all stages of development to provide a global perspective on education,
        science and technology, culture, and communication. The UIS is the official
        source for the indicators needed to achieve SDG 4\u2013Education 2030 and
        key targets in science and innovation, culture and communication.</com:Description><str:Contact><com:Name
        xml:lang=\"en\">UNESCO Institute for Statistics (UIS)</com:Name><str:Department
        xml:lang=\"en\">UNESCO Institute for Statistics (UIS)</str:Department><str:Role
        xml:lang=\"en\">Single entry point for external inquiries</str:Role><str:URI>http://uis.unesco.org</str:URI><str:Email>uis.datarequests@unesco.org</str:Email></str:Contact></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).OECD\" id=\"OECD\"><com:Name
        xml:lang=\"en\">Organisation for Economic Co-operation and Development (OECD)</com:Name><com:Description
        xml:lang=\"en\">The mission of the Organisation for Economic Co-operation
        and Development (OECD) is to promote policies that will improve the economic
        and social well-being of people around the world.\n\nThe OECD provides a forum
        in which governments can work together to share experiences and seek solutions
        to common problems. We work with governments to understand what drives economic,
        social and environmental change. We measure productivity and global flows
        of trade and investment. We analyse and compare data to predict future trends.
        We set international standards on a wide range of things, from agriculture
        and tax to the safety of chemicals.\n\nWe look, too, at issues that directly
        affect the lives of ordinary people, like how much they pay in taxes and social
        security, and how much leisure time they can take. We compare how different
        countries\u2019 school systems are readying their young people for modern
        life, and how different countries\u2019 pension systems will look after their
        citizens in old age.\n\nDrawing on facts and real-life experience, we recommend
        policies designed to make the lives of ordinary people better. We work with
        business, through the Business and Industry Advisory Committee to the OECD,
        and with labour, through the Trade Union Advisory Committee. We have active
        contacts as well with other civil society organisations. The common thread
        of our work is a shared commitment to market economies backed by democratic
        institutions and focused on the wellbeing of all citizens. Along the way,
        we also set out to make life harder for the terrorists, tax dodgers, crooked
        businessmen and others whose actions undermine a fair and open society.</com:Description></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).METATECH\"
        id=\"METATECH\"><com:Name xml:lang=\"en\">Metadata Technology</com:Name><com:Description
        xml:lang=\"en\">Provider of consultancy, software, and services to the SDMX
        community.</com:Description><str:Contact><com:Name xml:lang=\"en\">Chris Nelson</com:Name><str:Department
        xml:lang=\"en\">Standards</str:Department><str:Role xml:lang=\"en\">Standards
        Consultant</str:Role><str:Telephone>+44 1483 418058</str:Telephone><str:URI>http://www.metadatatechnology.com</str:URI><str:URI>http://www.sdmxfusion.com</str:URI><str:URI>http://registry.sdmxcloud.org</str:URI><str:URI>http://data.sdmxcloud.org</str:URI><str:Email>chris.nelson@metadatatechnology.com</str:Email></str:Contact><str:Contact><com:Name
        xml:lang=\"en\">Matthew Nelson</com:Name><str:Department xml:lang=\"en\">IT</str:Department><str:Role
        xml:lang=\"en\">Software Architect</str:Role><str:Telephone>+44 1483 418058</str:Telephone><str:URI>http://sdmxsource.org</str:URI><str:Email>matt.nelson@metadatatechnology.com</str:Email></str:Contact></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).ILO\" id=\"ILO\"><com:Name
        xml:lang=\"en\">International Labour Organization</com:Name><com:Description
        xml:lang=\"en\">The ILO was founded in 1919, in the wake of a destructive
        war, to pursue a vision based on the premise that universal, lasting peace
        can be established only if it is based on social justice. The ILO became the
        first specialized agency of the UN in 1946.\n\nThe main aims of the ILO are
        to promote rights at work, encourage decent employment opportunities, enhance
        social protection and strengthen dialogue on work-related issues.</com:Description></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).IBGE\" id=\"IBGE\"><com:Name
        xml:lang=\"en\">Brazilian Institute of Geography and Statistics (IBGE)</com:Name><com:Name
        xml:lang=\"br\">Instituto Brasileiro de Geografia e Estat\xEDstica</com:Name></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).NG_NSB\"
        id=\"NG_NSB\"><com:Name xml:lang=\"en\">Nigerian National Bureau of Statistics
        (NBS)</com:Name><com:Description xml:lang=\"en\">The National Bureau of Statistics
        Nigeria as the mandate to generate, on a continuous and sustainable basis,
        socio-economic statistics on all facets of development in Nigeria.</com:Description><str:Contact><com:Name
        xml:lang=\"en\">Lucky OGIDAN</com:Name><str:Department xml:lang=\"en\">Information
        and Communication Technology Department</str:Department><str:Role xml:lang=\"en\">Web
        Application Manager</str:Role><str:URI>http://www.nigerianstat.gov.ng</str:URI><str:Email>feedback@nigerianstat.gov.ng</str:Email><str:Email>laogidan@nigerianstat.gov.ng</str:Email></str:Contact></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).GW_INE\"
        id=\"GW_INE\"><com:Name xml:lang=\"en\">National Statistical Institute of
        Guinea-Bissau - Instituto Nacional de Estat\xEDstica da Guin\xE9-Bissau (INE)</com:Name></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).BT_NSB\"
        id=\"BT_NSB\"><com:Name xml:lang=\"en\">Bhutan National Statistics Bureau
        (NSB)</com:Name></str:Agency><str:Agency urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).BOI\"
        id=\"BOI\"><com:Name xml:lang=\"en\">Bank of Israel (BOI)</com:Name><com:Description
        xml:lang=\"en\">The Bank of Israel is the central bank of the State of Israel.
        \nThe main objectives of the Bank are listed and prioritized in the Bank of
        Israel Law : To maintain price stability; to support other objectives of the
        Government's economic policy, especially growth, employment, and reducing
        social gaps; and supporting the stability of the financial system.</com:Description><str:Contact><com:Name
        xml:lang=\"en\">Head of BI unit</com:Name><str:Department xml:lang=\"en\">Information
        and Statistics Dept.</str:Department><str:Role xml:lang=\"en\">Head of BI
        unit</str:Role><str:URI>https://www.boi.org.il/en/Pages/Default.aspx</str:URI><str:Email>nir.israeli@boi.org.il</str:Email></str:Contact></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).UNSD\" id=\"UNSD\"><com:Name
        xml:lang=\"en\">United Nations Statistics Division (UNSD)</com:Name><com:Description
        xml:lang=\"en\">The Statistics Division of the Department of Economic and
        Social Affairs of the United Nations Secretariat (UNSD) is committed to the
        advancement of the global statistical system. UNSD compiles and disseminates
        global statistical information, develops standards and norms for statistical
        activities, and supports countries' efforts to strengthen their national statistical
        systems. UNSD facilitates the coordination of international statistical activities
        and supports the functioning of the United Nations Statistical Commission
        as the apex entity of the global statistical system.</com:Description><str:Contact><com:Name
        xml:lang=\"en\">Govindaraj Rangaraj</com:Name><str:URI>http://unstats.un.org</str:URI><str:Email>rangaraj@un.org</str:Email></str:Contact></str:Agency><str:Agency
        urn=\"urn:sdmx:org.sdmx.infomodel.base.Agency=SDMX:AGENCIES(1.0).IAEG-SDGs\"
        id=\"IAEG-SDGs\"><com:Name xml:lang=\"en\">Inter-agency and Expert Group on
        SDG Indicators (IAEG-SDGs)</com:Name><com:Description xml:lang=\"en\">The
        United Nations Statistical Commission created the Inter-agency and Expert
        Group on SDG Indicators (IAEG-SDGs), composed of Member States and including
        regional and international agencies as observers. The IAEG-SDGs was tasked
        to develop and implement the global indicator framework for the Goals and
        targets of the 2030 Agenda. The global indicator framework was developed by
        the IAEG-SDGs and agreed upon, including refinements on several indicators,
        at the 48th session of the United Nations Statistical Commission held in March
        2017. The global indicator framework was subsequently adopted by the General
        Assembly on 6 July 2017 and is contained in the Resolution adopted by the
        General Assembly on Work of the Statistical Commission pertaining to the 2030
        Agenda for Sustainable Development (A/RES/71/313)</com:Description><str:Contact><com:Name
        xml:lang=\"en\">Abdulla Gozalov</com:Name><str:URI>https://unstats.un.org/sdgs/iaeg-sdgs/</str:URI><str:Email>gozalov@un.org</str:Email></str:Contact></str:Agency><str:Agency
