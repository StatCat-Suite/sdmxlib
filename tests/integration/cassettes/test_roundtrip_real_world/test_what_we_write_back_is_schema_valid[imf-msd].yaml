        structureURL=\"https://registry.sdmx.org/ws/public/sdmxapi/rest/conceptscheme/IAEG-SDGs/SDG_META_CONCEPTS/1.0\"
        isExternalReference=\"false\" agencyID=\"IAEG-SDGs\" id=\"SDG_META_CONCEPTS\"
        isFinal=\"true\" version=\"1.0\"><com:Name xml:lang=\"en\">SDG Metadata Concepts</com:Name><com:Description
        xml:lang=\"en\">Metadata concepts for Sustainable Development Goals Indicators</com:Description><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).SDG_INDICATOR_INFO\"
        id=\"SDG_INDICATOR_INFO\"><com:Name xml:lang=\"en\">0. Indicator information</com:Name><com:Description
        xml:lang=\"en\">Description of the Goal, Target, Indicator and data series
        - if applicable. The date/period when this metadata file is last updated should
        be provided. The linkages with any other Goals and Targets under the SDG framework,
        if any, should be described. The name of international organisation(s) responsible
        for monitoring this indicator should be provided.</com:Description></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).SDG_GOAL\"
        id=\"SDG_GOAL\"><com:Name xml:lang=\"en\">0.a. Goal</com:Name><com:Description
        xml:lang=\"en\">SDG Goal number and name.</com:Description><str:Parent><Ref
        id=\"SDG_INDICATOR_INFO\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).SDG_TARGET\"
        id=\"SDG_TARGET\"><com:Name xml:lang=\"en\">0.b. Target</com:Name><com:Description
        xml:lang=\"en\">SDG Target number and name.</com:Description><str:Parent><Ref
        id=\"SDG_INDICATOR_INFO\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).SDG_INDICATOR\"
        id=\"SDG_INDICATOR\"><com:Name xml:lang=\"en\">0.c. Indicator</com:Name><com:Description
        xml:lang=\"en\">SDG Indicator number and name.</com:Description><str:Parent><Ref
        id=\"SDG_INDICATOR_INFO\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).SDG_SERIES_DESCR\"
        id=\"SDG_SERIES_DESCR\"><com:Name xml:lang=\"en\">0.d. Series</com:Name><com:Description
        xml:lang=\"en\">Description of SDG data series.</com:Description><str:Parent><Ref
        id=\"SDG_INDICATOR_INFO\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).META_LAST_UPDATE\"
        id=\"META_LAST_UPDATE\"><com:Name xml:lang=\"en\">0.e. Metadata update</com:Name><com:Description
        xml:lang=\"en\">The date when this metadata report is last updated.</com:Description><str:Parent><Ref
        id=\"SDG_INDICATOR_INFO\"/></str:Parent><str:CoreRepresentation><str:TextFormat
        isSequence=\"false\" textType=\"GregorianDay\"/></str:CoreRepresentation></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).SDG_RELATED_INDICATORS\"
        id=\"SDG_RELATED_INDICATORS\"><com:Name xml:lang=\"en\">0.f. Related Indicators</com:Name><com:Description
        xml:lang=\"en\">Linkages with any other Goals and Targets.</com:Description><str:Parent><Ref
        id=\"SDG_INDICATOR_INFO\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).SDG_CUSTODIAN_AGENCIES\"
        id=\"SDG_CUSTODIAN_AGENCIES\"><com:Name xml:lang=\"en\">0.g. International
        organisations(s) responsible for global monitoring</com:Name><com:Description
        xml:lang=\"en\">Global reporting: International organizations (departments/offices)
        responsible for monitoring this indicator at the global level. rnCountry reporting:
        This concept has no national counterpart.</com:Description><str:Parent><Ref
        id=\"SDG_INDICATOR_INFO\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).CONTACT\"
        id=\"CONTACT\"><com:Name xml:lang=\"en\">1. Data reporter</com:Name><com:Description
        xml:lang=\"en\">Information of the contact persons and their organization
        responsible for the reporting of the indicator or time series specified.</com:Description></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).CONTACT_ORGANISATION\"
        id=\"CONTACT_ORGANISATION\"><com:Name xml:lang=\"en\">1.a. Organisation</com:Name><com:Description
        xml:lang=\"en\">Agency responsible for reporting of the indicator or time
        series specified below.</com:Description><str:Parent><Ref id=\"CONTACT\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).CONTACT_NAME\"
        id=\"CONTACT_NAME\"><com:Name xml:lang=\"en\">1.b. Contact person(s)</com:Name><com:Description
        xml:lang=\"en\">Name(s) of the contact points for the data or metadata.</com:Description><str:Parent><Ref
        id=\"CONTACT\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).ORGANISATION_UNIT\"
        id=\"ORGANISATION_UNIT\"><com:Name xml:lang=\"en\">1.c. Contact Organisation
        Unit</com:Name><com:Description xml:lang=\"en\">Organisation unit information
        of the contact points for the data or metadata.</com:Description><str:Parent><Ref
        id=\"CONTACT\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).CONTACT_FUNCT\"
        id=\"CONTACT_FUNCT\"><com:Name xml:lang=\"en\">1.d. Contact Person Function</com:Name><com:Description
        xml:lang=\"en\">Functional title(s) of the contact points for the data or
        metadata.</com:Description><str:Parent><Ref id=\"CONTACT\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).CONTACT_PHONE\"
        id=\"CONTACT_PHONE\"><com:Name xml:lang=\"en\">1.e. Contact Phone</com:Name><com:Description
        xml:lang=\"en\">Phone number(s) of the contact points for the data or metadata.</com:Description><str:Parent><Ref
        id=\"CONTACT\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).CONTACT_MAIL\"
        id=\"CONTACT_MAIL\"><com:Name xml:lang=\"en\">1.f. Contact Mail</com:Name><com:Description
        xml:lang=\"en\">Mailing address(es) of the contact points for the data or
        metadata.</com:Description><str:Parent><Ref id=\"CONTACT\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).CONTACT_EMAIL\"
        id=\"CONTACT_EMAIL\"><com:Name xml:lang=\"en\">1.g. Contact emails</com:Name><com:Description
        xml:lang=\"en\">E-mail address(es) of the contact points for the data or metadata.</com:Description><str:Parent><Ref
        id=\"CONTACT\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).IND_DEF_CON_CLASS\"
        id=\"IND_DEF_CON_CLASS\"><com:Name xml:lang=\"en\">2. Definition, concepts
        and classifications</com:Name><com:Description xml:lang=\"en\">Precise definition
        of the indicator including references to standards and classifications, preferably
        relying on international agreed definitions. The indicator definition should
        be unambiguous and be expressed in universally applicable terms. It must clearly
        express the unit of measurement (proportion, dollars, number of people, etc.).
        rnrnPrecise definition of all different concepts and terms associated with
        the indicator, also including reference to any associated classifications.</com:Description></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).STAT_CONC_DEF\"
        id=\"STAT_CONC_DEF\"><com:Name xml:lang=\"en\">2.a. Definition and Concepts</com:Name><com:Description
        xml:lang=\"en\">Precise definition of the indicator preferably relying on
        internationally agreed definitions. The indicator definition should be unambiguous
        and be expressed in universally applicable terms. Precise definition of all
        different concepts and terms associated with the indicator, also including
        reference to any associated classifications.</com:Description><str:Parent><Ref
        id=\"IND_DEF_CON_CLASS\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).UNIT_MEASURE\"
        id=\"UNIT_MEASURE\"><com:Name xml:lang=\"en\">2.b. Unit of Measure</com:Name><com:Description
        xml:lang=\"en\">Description of the unit of measurement (proportion, dollars,
        number of people, etc.)</com:Description><str:Parent><Ref id=\"IND_DEF_CON_CLASS\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).CLASS_SYSTEM\"
        id=\"CLASS_SYSTEM\"><com:Name xml:lang=\"en\">2.c. Classifications</com:Name><com:Description
        xml:lang=\"en\">Describe references to both national and international standards
        and classification being used. [Information to be provided where applicable.]rn</com:Description><str:Parent><Ref
        id=\"IND_DEF_CON_CLASS\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).SRC_TYPE_COLL_METHOD\"
        id=\"SRC_TYPE_COLL_METHOD\"><com:Name xml:lang=\"en\">3. Data source type
        and data collection method</com:Name><com:Description xml:lang=\"en\">Description
        of data sources, data collection methods, and related information such as
        descriptions of all data collection methods, data collection and release calendar,
        data providers and compilers, as well as their institutional mandates.</com:Description></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).SOURCE_TYPE\"
        id=\"SOURCE_TYPE\"><com:Name xml:lang=\"en\">3.a. Data sources</com:Name><com:Description
        xml:lang=\"en\">Description of all actual and recommended sources of data.
        This description should include, when applicable, any changes of the data
        source over time, details of denominator (if from a different source) and
        any other relevant information related to the origin of the source or indicator.
        Similar details should be given for administrative sources.</com:Description><str:Parent><Ref
        id=\"SRC_TYPE_COLL_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).COLL_METHOD\"
        id=\"COLL_METHOD\"><com:Name xml:lang=\"en\">3.b. Data collection method</com:Name><com:Description
        xml:lang=\"en\">Description of all methods used for data collection. This
        description should include, when applicable, the sample frame used, the questions
        used to collect the data, the type of interview, the dates/duration of fieldwork,
        the sample size and the response rate. Some additional information on questionnaire
        design and testing, interviewer training, methods used to monitor non-response
        etc. should be provided here. Questionnaires used should be annexed (if very
        long: via hyperlink).</com:Description><str:Parent><Ref id=\"SRC_TYPE_COLL_METHOD\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).FREQ_COLL\"
        id=\"FREQ_COLL\"><com:Name xml:lang=\"en\">3.c. Data collection calendar</com:Name><com:Description
        xml:lang=\"en\">Dates when source collection is next planned.</com:Description><str:Parent><Ref
        id=\"SRC_TYPE_COLL_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).REL_CAL_POLICY\"
        id=\"REL_CAL_POLICY\"><com:Name xml:lang=\"en\">3.d. Data release calendar</com:Name><com:Description
        xml:lang=\"en\">Expected dates of release of new data for this indicator,
        including the year (or, ideally, the quarter/month when the next data point
        associated with the indicator will become available).</com:Description><str:Parent><Ref
        id=\"SRC_TYPE_COLL_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).DATA_SOURCE\"
        id=\"DATA_SOURCE\"><com:Name xml:lang=\"en\">3.e. Data providers</com:Name><com:Description
        xml:lang=\"en\">Identification of national and/or international data provider(s),
        specifying the organization(s) responsible for producing the data.</com:Description><str:Parent><Ref
        id=\"SRC_TYPE_COLL_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).COMPILING_ORG\"
        id=\"COMPILING_ORG\"><com:Name xml:lang=\"en\">3.f. Data compilers</com:Name><com:Description
        xml:lang=\"en\">Organization(s) responsible for compilation of on this indicator
        either at national or global level.</com:Description><str:Parent><Ref id=\"SRC_TYPE_COLL_METHOD\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).INST_MANDATE\"
        id=\"INST_MANDATE\"><com:Name xml:lang=\"en\">3.g. Institutional Mandate</com:Name><com:Description
        xml:lang=\"en\">Description of the set of rules or other formal set of instructions
        assigning responsibility as well as the authority to an organisation for the
        collection, processing, and dissemination of statistics for this indicator.</com:Description><str:Parent><Ref
        id=\"SRC_TYPE_COLL_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).OTHER_METHOD\"
        id=\"OTHER_METHOD\"><com:Name xml:lang=\"en\">4. Other methodological considerations</com:Name><com:Description
        xml:lang=\"en\">Other methodological considerations. These include rationale
        behind the indicator, comments and limitations, computation methodology at
        the country, regional, and global level,  treatment of missing values if applicable,
        and information related to quality assurance.</com:Description></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).RATIONALE\"
        id=\"RATIONALE\"><com:Name xml:lang=\"en\">4.a. Rationale</com:Name><com:Description
        xml:lang=\"en\">Description of the purpose and rationale behind the indicator,
        as well as examples and guidance on its correct interpretation and meaning.</com:Description><str:Parent><Ref
        id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).REC_USE_LIM\"
        id=\"REC_USE_LIM\"><com:Name xml:lang=\"en\">4.b. Comment and limitations</com:Name><com:Description
        xml:lang=\"en\">Comments on the feasibility, suitability, relevance and limitations
        of the indicator. Also includes data comparability issues, presence of wide
        confidence intervals (such as for maternal mortality ratios); provides further
        details on additional non-official indicators commonly used together with
        the indicator.</com:Description><str:Parent><Ref id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).DATA_COMP\"
        id=\"DATA_COMP\"><com:Name xml:lang=\"en\">4.c. Method of computation</com:Name><com:Description
        xml:lang=\"en\">Explanation of how the indicator is calculated, including
        mathematical formulas and descriptive information of computations made on
        the source data to produce the indicator (including adjustments and weighting).
        This explanation should also highlight cases in which mixed sources are used
        or where the calculation has changed over time (i.e., discontinuities in the
        series).</com:Description><str:Parent><Ref id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).DATA_VALIDATION\"
        id=\"DATA_VALIDATION\"><com:Name xml:lang=\"en\">4.d. Validation</com:Name><com:Description
        xml:lang=\"en\">Description of process of monitoring the results of data compilation
        and ensuring the quality of the statistical results, including consultation
        process with countries on the national data submitted to the SDGs Indicators
        Database. Descriptions and links to all relevant reference materials should
        be provided.</com:Description><str:Parent><Ref id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).ADJUSTMENT\"
        id=\"ADJUSTMENT\"><com:Name xml:lang=\"en\">4.e. Adjustments</com:Name><com:Description
        xml:lang=\"en\">Global reporting: Description of any adjustments with respect
        to use of standard classifications and harmonization of breakdowns for age
        group and other dimensions, or adjustments made for compliance with specific
        international or national definitions.rnNational reporting:  This concept
        is typically not applicable for national reporting.</com:Description><str:Parent><Ref
        id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).IMPUTATION\"
        id=\"IMPUTATION\"><com:Name xml:lang=\"en\">4.f. Treatment of missing values
        (i) at country level and (ii) at regional level.</com:Name><com:Description
        xml:lang=\"en\">Global reporting: (National level) Description of the methodology
        employed for producing estimates for the indicator when country data are not
        available, including any mathematical formulas and description of additional
        variables used as input into the estimation process.rn(Regional level) Description
        of how missing values for individual countries or areas are imputed or otherwise
        estimated by international agencies to derive regional or global aggregates
        of the indicator. rnNational reporting: This concept is not applicable for
        national reporting.</com:Description><str:Parent><Ref id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).REG_AGG\"
        id=\"REG_AGG\"><com:Name xml:lang=\"en\">4.g. Regional aggregations</com:Name><com:Description
        xml:lang=\"en\">Global reporting: Description of the methodology, including
        any mathematical formulas, used for the calculation of the regional/global
        aggregates from the country values. Description of the weighting structure
        used for aggregating country indicator values to regional and global levels.
        Additional methodological details on how the data from countries or areas
        is assembled by custodian international agencies to provide regional and global
        aggregates. This is distinct from the method of computation, which looks at
        how the indicator is compiled at a national level. rnNational reporting: This
        concept is not applicable for national reporting.</com:Description><str:Parent><Ref
        id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).DOC_METHOD\"
        id=\"DOC_METHOD\"><com:Name xml:lang=\"en\">4.h. Methods and guidance available
        to countries for the compilation of the data at the national level</com:Name><com:Description
        xml:lang=\"en\">Global reporting: Description of methodology used by countries
        for the compilation of data at national level and the relevant international
        recommendations and guidelines available to countries. Descriptions and links
        to all relevant reference materials should be provided. rnNational reporting:
        For national reporting a country may refer to the globally available metadata
        and explain how it is being used.</com:Description><str:Parent><Ref id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).QUALITY_MGMNT\"
        id=\"QUALITY_MGMNT\"><com:Name xml:lang=\"en\">4.i. Quality management</com:Name><com:Description
        xml:lang=\"en\">Description of systems and frameworks in place within an organisation
        to manage the quality of statistical products and processes.rn</com:Description><str:Parent><Ref
        id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).QUALITY_ASSURE\"
        id=\"QUALITY_ASSURE\"><com:Name xml:lang=\"en\">4.j. Quality assurance</com:Name><com:Description
        xml:lang=\"en\">Description of practices and guidelines focusing on quality
        in general and dealing with quality of statistical programmes at your agency,
        including measures for ensuring the efficient use of resources.rn</com:Description><str:Parent><Ref
        id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).QUALITY_ASSMNT\"
        id=\"QUALITY_ASSMNT\"><com:Name xml:lang=\"en\">4.k. Quality assessment</com:Name><com:Description
        xml:lang=\"en\">Description of overall evaluation of fulfilling quality requirements,
        based on standard quality criteria.</com:Description><str:Parent><Ref id=\"OTHER_METHOD\"/></str:Parent></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).COVERAGE\"
        id=\"COVERAGE\"><com:Name xml:lang=\"en\">5. Data availability and disaggregation</com:Name><com:Description
        xml:lang=\"en\">Global reporting: Indicate for how many countries the data
        for this indicator are already currently available on a regular basis. Data
        availability by regional breakdowns and time periods can also be descibed
        here. Describe the specification of the dimensions and levels used for disaggregation
        of the indicator (e.g., income, sex, age group, geographic location, disability
        status, etc.).rnNational reporting: Data availability by sub-national breakdowns
        and time periods can be descibed here. Describe the specification of the dimensions
        and levels used for disaggregation of the indicator (e.g., income, sex, age
        group, geographic location, disability status, etc.).</com:Description></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).COMPARABILITY\"
        id=\"COMPARABILITY\"><com:Name xml:lang=\"en\">6. Comparability / Deviation
        from international standards</com:Name><com:Description xml:lang=\"en\">Explanation
        on the differences between country produced and internationally estimated
        data on this indicator, highlighting and summarising the main sources of differences.</com:Description></str:Concept><str:Concept
        urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).OTHER_DOC\"
        id=\"OTHER_DOC\"><com:Name xml:lang=\"en\">7. References and Documentation</com:Name><com:Description
        xml:lang=\"en\">Descriptions and links to all relevant reference materials
        related to this indicator.</com:Description></str:Concept><str:Concept urn=\"urn:sdmx:org.sdmx.infomodel.conceptscheme.Concept=IAEG-SDGs:SDG_META_CONCEPTS(1.0).TRANSLATIONS\"
        id=\"TRANSLATIONS\"><com:Name xml:lang=\"en\">8. Translations</com:Name><com:Description
        xml:lang=\"en\">Additional information on translation of reference metadata
        set.</com:Description></str:Concept></str:ConceptScheme></str:Concepts><str:MetadataStructures><str:MetadataStructure
