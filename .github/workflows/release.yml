# Publish a release to PyPI with trusted publishing (GH-238).
#
# Runs when `just release-4-merge` publishes a GitHub release, never on a
# merge to main. It builds sdmxlib and sdmxlib-cli from the release's tag,
# waits for the maintainer to approve the `pypi` environment, publishes both
# with a short-lived OIDC token and PyPI attestations, then attaches the files
# and their Sigstore signatures to the GitHub release. No PyPI token is stored
# anywhere. The tests are not rerun here: the gate is `just ci` on the release
# branch, before the tag exists.

name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      # The tag names the version; both packages must carry it (GH-67).
      - name: Check the tag matches both versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for package in sdmxlib sdmxlib-cli; do
            version=$(uv version --package "${package}" --short)
            if [[ "v${version}" != "${TAG}" ]]; then
              echo "error: ${package} is ${version}, the tag is ${TAG}" >&2
              exit 1
            fi
          done
      - run: uv build --all-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment requires the maintainer's approval, and PyPI's trusted
    # publishers for both projects name it.
    environment:
      name: pypi
      url: https://pypi.org/project/sdmxlib/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  sign:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          release-signing-artifacts: true
