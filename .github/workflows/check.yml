# Run `just check` (lint, format, docstrings, prose, the `Any` ratchet,
# indexes, zizmor, pyrefly) on every pull request and push to main (GH-236).
#
# uv.lock is gitignored, so this resolves the dependencies fresh, as a user's
# install does. The tests stay in the local `just ci`, which is the gate; this
# job reports and blocks nothing.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# A newer push to the same branch or PR supersedes a run still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.46.0"
      - run: uv sync --group dev
      - run: just check
