# OpenSSF Scorecard: scores the repository's practices (pinned actions, token
# permissions, branch protection, signed releases, ...) weekly and on each push
# to main. Results go to the Security tab and to the public Scorecard API,
# which the README badge reads. It reports, and blocks nothing (GH-220).

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
