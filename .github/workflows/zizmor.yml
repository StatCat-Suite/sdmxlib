# Lint the workflows with zizmor: unpinned actions, over-broad permissions,
# template injection. `just lint-workflows` runs the same check locally,
# offline; this run adds zizmor's online audits and puts findings under the
# Security tab. It reports, and blocks nothing (GH-220).

name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"
