[project]
name = "sdmxlib-cli"
# Locked to sdmxlib's version and released with it (GH-67): the release steps
# bump both and the pin below, and a test asserts the three agree, so the
# command can never be installed against an sdmxlib it was not tested with.
version = "0.76.2"
description = "sdmxlib from the command line: check SDMX bundles"
readme = "README.md"
license = "Apache-2.0"
# Its own copy, as PEP 639 keeps `license-files` inside the package directory;
# a test asserts it is sdmxlib's, byte for byte.
license-files = ["LICENSE"]
authors = [{ name = "gabrielgellner", email = "gabrielgellner@gmail.com" }]
requires-python = ">=3.14"
keywords = ["sdmx", "statistics", "metadata", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
# A standalone install, so sdmxlib itself never depends on typer:
# `uv tool install sdmxlib-cli` gives an `sdmxlib` command.
dependencies = [
    "sdmxlib==0.76.2",
    # Pre-1.0, so capped at the minor.
    "typer>=0.27.3,<0.28",
]

[project.scripts]
sdmxlib = "sdmxlib_cli:app"

[project.urls]
Homepage      = "https://github.com/StatCat-Suite/sdmxlib"
Repository    = "https://github.com/StatCat-Suite/sdmxlib"
Documentation = "https://statcat-suite.github.io/sdmxlib"
Changelog     = "https://github.com/StatCat-Suite/sdmxlib/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/StatCat-Suite/sdmxlib/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
sdmxlib = { workspace = true }
