site_name: sdmxlib
site_description: "SDMX for Python: structures, reference metadata and observation data, from REST, files or a local DuckDB store."
site_url: "https://statcat-suite.github.io/sdmxlib/"
repo_url: "https://github.com/StatCat-Suite/sdmxlib"
repo_name: "StatCat-Suite/sdmxlib"
edit_uri: ""

# ── Suite configuration ─────────────────────────────────────────────────────
# The StatCat Suite block, copied from https://statcat-suite.github.io/sites/
# (the hub repository's docs/sites.md). Change it there first; every project
# site carries the same block, so the sites share one look. Its
# `validation.links.anchors: warn` makes a link to a heading that no longer
# exists fail `mkdocs build --strict` (just docs-build).

validation:
  links:
    anchors: warn

extra_css:
  - https://statcat-suite.github.io/assets/stylesheets/statcat.css

theme:
  name: material
  icon:
    logo: material/library-shelves
    repo: fontawesome/brands/github
  favicon: https://statcat-suite.github.io/assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow

extra:
  homepage: https://statcat-suite.github.io/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/StatCat-Suite
      name: StatCat Suite on GitHub

copyright: 'Part of the <a href="https://statcat-suite.github.io/">StatCat Suite</a>'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# ── End of suite configuration ──────────────────────────────────────────────

