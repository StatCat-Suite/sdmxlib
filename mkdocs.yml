# Links the tracker references the docs cite: `#N` / `!N` / `%N` to the GitLab
# export under history/gitlab/, `GH-N` to the GitHub issue (GH-85).
hooks:
  - tools/mkdocs_issue_links.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            heading_level: 3
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
